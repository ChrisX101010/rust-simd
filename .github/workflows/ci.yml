name: Native CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04

          - name: Linux ARM64
            os: ubuntu-24.04-arm

          - name: Windows x86_64
            os: windows-2025

          - name: Windows ARM64
            os: windows-11-arm

          - name: macOS Intel
            os: macos-15-intel

          - name: macOS ARM64
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust environment
        run: rustup show

      - name: Check
        run: cargo check --workspace --locked

      - name: Debug tests
        run: cargo test --workspace --locked

      - name: Release tests
        run: cargo test --workspace --release --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Doctor
        run: cargo run -p cargo-simd --release -- simd doctor

      - name: Differential verification
        run: cargo run -p cargo-simd --release -- simd verify

      - name: Require NEON verification on Linux ARM64
        if: matrix.name == 'Linux ARM64'
        shell: bash
        run: |
          OUTPUT="$(cargo run -p cargo-simd --release -- simd verify)"

          echo "$OUTPUT"

          echo "$OUTPUT" | grep -F -- "- neon"

      - name: Resource build plan
        run: cargo run -p cargo-simd --release -- simd build --dry-run --release

      - name: Resource test plan
        run: cargo run -p cargo-simd --release -- simd test --dry-run --workspace
