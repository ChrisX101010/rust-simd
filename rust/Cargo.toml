[package]
name = "rust-simd"
version = "0.3.0"
edition = "2024"
authors = ["Hristo"]
description = "Safe, backend-neutral SIMD kernels for Rust"
license = "MIT"
repository = "https://github.com/ChrisX101010/rust-simd"
readme = "../README.md"
exclude = [
    "build.rs.zig-backend",
    "src/ffi.rs",
    "src/bin/**",
    "vendor/**",
]

[lib]
path = "src/lib.rs"
